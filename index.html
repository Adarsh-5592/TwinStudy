        const checks = [
          password.length >= 8,
          /[A-Z]/.test(password),
          /[a-z]/.test(password),
          /[0-9]/.test(password),
          /[^A-Za-z0-9\s]/.test(password)
        ];
        const score = checks.filter(Boolean).length;
        const label = !password ? "Not entered"
          : score <= 2 ? "Weak"
          : score === 3 ? "Fair"
          : score === 4 ? "Good"
          : "Strong";
        return { score, label };
      };

        if (!/[0-9]/.test(password)) return "Add at least one number.";

      // Safely render common Markdown produced by Study Buddy.
      const renderInlineMarkdown = (text, prefix) => {
        const parts = [];
        const pattern = /(\*\*.+?\*\*|`[^`]+`|\*[^*]+\*)/g;
        let last = 0;
        let match;
        let index = 0;

        while ((match = pattern.exec(text)) !== null) {
          if (match.index > last) parts.push(text.slice(last, match.index));
          const token = match[0];
          const key = `${prefix}-${index++}`;

          if (token.startsWith("**")) {
            parts.push(<strong key={key}>{token.slice(2, -2)}</strong>);
          } else if (token.startsWith("`")) {
            parts.push(<code key={key} className="rounded bg-slate-100 px-1.5 py-0.5 font-mono text-[0.92em] text-pink-700">{token.slice(1, -1)}</code>);
          } else {
            parts.push(<em key={key}>{token.slice(1, -1)}</em>);
          }
          last = pattern.lastIndex;
        }

        if (last < text.length) parts.push(text.slice(last));
        return parts;
      };

      const renderChatMarkdown = (content) => {
        const lines = String(content ?? "").replace(/\r\n/g, "\n").split("\n");
        const blocks = [];
        let paragraph = [];
        let listItems = [];
        let listType = null;

        const flushParagraph = () => {
          if (!paragraph.length) return;
          const current = paragraph;
          paragraph = [];
          blocks.push(
            <p key={`p-${blocks.length}`} className="m-0 whitespace-pre-wrap">
              {current.map((line, i) => (
                <React.Fragment key={`line-${i}`}>
                  {i > 0 ? "\n" : ""}
                  {renderInlineMarkdown(line, `p-${blocks.length}-${i}`)}
                </React.Fragment>
              ))}
            </p>
          );
        };

        const flushList = () => {
          if (!listItems.length) return;
          const items = listItems;
          const Tag = listType === "ol" ? "ol" : "ul";
          blocks.push(
            <Tag key={`list-${blocks.length}`} className={`${listType === "ol" ? "list-decimal" : "list-disc"} pl-5 space-y-1`}>
              {items.map((item, i) => (
                <li key={i}>{renderInlineMarkdown(item, `list-${blocks.length}-${i}`)}</li>
              ))}
            </Tag>
          );
          listItems = [];
          listType = null;
        };

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const trimmed = line.trim();

          if (trimmed.startsWith("```")) {
            flushParagraph();
            flushList();
            const codeLines = [];
            i++;
            while (i < lines.length && !lines[i].trim().startsWith("```")) {
              codeLines.push(lines[i]);
              i++;
            }
            blocks.push(
              <pre key={`code-${blocks.length}`} className="max-w-full overflow-x-auto rounded-xl bg-slate-900 p-3 text-sm text-slate-100">
                <code className="font-mono whitespace-pre">{codeLines.join("\n")}</code>
              </pre>
            );
            continue;
          }

          if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) {
            flushParagraph();
            flushList();
            blocks.push(<hr key={`hr-${blocks.length}`} className="border-slate-200" />);
            continue;
          }

          if (trimmed.startsWith("|") && trimmed.endsWith("|")) {
            flushParagraph();
            flushList();
            const rows = [];
            while (i < lines.length && lines[i].trim().startsWith("|") && lines[i].trim().endsWith("|")) {
              rows.push(lines[i].trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim()));
              i++;
            }
            i--;

            const hasSeparator = rows.length > 1 && rows[1].some(cell => /^:?-{3,}:?$/.test(cell));
            const bodyRows = hasSeparator ? rows.slice(2) : rows.slice(1);

            blocks.push(
              <div key={`table-${blocks.length}`} className="max-w-full overflow-x-auto">
                <table className="w-full border-collapse text-left text-sm">
                  <thead>
                    <tr>{(rows[0] || []).map((cell, j) => (
                      <th key={j} className="border border-slate-200 bg-slate-100 px-3 py-2 font-bold">
                        {renderInlineMarkdown(cell, `th-${j}`)}
                      </th>
                    ))}</tr>
                  </thead>
                  <tbody>
                    {bodyRows.map((row, ri) => (
                      <tr key={ri}>{row.map((cell, ci) => (
                        <td key={ci} className="border border-slate-200 px-3 py-2 align-top">
                          {renderInlineMarkdown(cell, `td-${ri}-${ci}`)}
                        </td>
                      ))}</tr>
                    ))}
                  </tbody>
                </table>
              </div>
            );
            continue;
          }

          const heading = trimmed.match(/^(#{1,4})\s+(.+)$/);
          if (heading) {
            flushParagraph();
            flushList();
            const Tag = heading[1].length <= 2 ? "h3" : "h4";
            blocks.push(
              <Tag key={`heading-${blocks.length}`} className="font-bold text-base mt-2">
                {renderInlineMarkdown(heading[2], `heading-${blocks.length}`)}
              </Tag>
            );
            continue;
          }

          const bullet = line.match(/^\s*[-*+]\s+(.+)$/);
          const numbered = line.match(/^\s*\d+[.)]\s+(.+)$/);
          if (bullet || numbered) {
            flushParagraph();
            const newType = numbered ? "ol" : "ul";
            if (listType && listType !== newType) flushList();
            listType = newType;
            listItems.push((bullet || numbered)[1]);
            continue;
          }

          if (!trimmed) {
            flushParagraph();
            flushList();
            continue;
          }

          flushList();
          paragraph.push(line);
        }

        flushParagraph();
        flushList();

        return <div className="chat-markdown space-y-2 break-words leading-relaxed">{blocks}</div>;

        return true;

        const gradeSubjects = Array.isArray(gradesOverview?.subject_breakdown) ? gradesOverview.subject_breakdown : [];
        const timetableClasses = Array.isArray(state?.classes) ? state.classes : [];
        const savedSubjects = Array.isArray(state?.subjects) ? state.subjects : [];
        const normalize = (value) => String(value ?? "").trim().toLowerCase().replace(/\s+/g, " ");

        // The timetable is authoritative for this comparison. If no timetable sessions exist,
        // don't silently display unrelated default/demo subjects.
        if (timetableClasses.length === 0) return [];

        return gradeSubjects.filter((gradeSubject) => {
          const gradeId = String(gradeSubject?.subject_id ?? "").trim();
          const gradeName = normalize(gradeSubject?.subject_name);
          return timetableClasses.some((session) => {
            const sessionId = String(session?.subject_id ?? session?.subjectId ?? "").trim();
            const sessionName = normalize(session?.subject_name || session?.subject || session?.name || session?.title);
            const linkedSubject = savedSubjects.find((subject) => {
              const savedId = String(subject?.id ?? subject?.subject_id ?? "").trim();
              const savedName = normalize(subject?.name || subject?.subject_name);
              return (sessionId && savedId === sessionId) || (sessionName && savedName === sessionName);
            });
            const allowedIds = [sessionId, linkedSubject?.id, linkedSubject?.subject_id]
              .map((value) => String(value ?? "").trim()).filter(Boolean);
            const allowedNames = [sessionName, normalize(linkedSubject?.name || linkedSubject?.subject_name)].filter(Boolean);
            return (gradeId && allowedIds.includes(gradeId)) || (gradeName && allowedNames.includes(gradeName));
          });
        });

      const handleProofFileSelect = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const sizeFormatted = file.size > 1024 * 1024
          ? (file.size / (1024 * 1024)).toFixed(1) + " MB"
          : Math.max(1, Math.round(file.size / 1024)) + " KB";
        const ext = (file.name.split(".").pop() || "").toLowerCase();
        const allowed = ["pdf", "txt", "md", "png", "jpg", "jpeg", "webp", "py", "ipynb", "cpp", "java", "c", "js", "html", "css", "sql"];

        setProofFile({ name: file.name, size: sizeFormatted, type: file.type || "Document" });
        setQuizQuestions([]);
        setQuizAnswers({});
        setQuizSubmitted(false);
        setQuizFeedback(null);

        if (!allowed.includes(ext)) {
          showNotification("Please upload notes as PDF, TXT, Markdown, image, or supported text/code file.");
          setProofFile(null);
          e.target.value = "";
          return;
        }
        if (!file.size || file.size > 6 * 1024 * 1024) {
          showNotification("Choose a non-empty file smaller than 6 MB.");
          setProofFile(null);
          e.target.value = "";
          return;
        }

        showNotification("Reading your notes and generating a source-based MCQ quiz...");
        try {
          const form = new FormData();
          form.append("document", file, file.name);
          form.append("task_title", proofModalTask?.title || "Study task");
          form.append("subject", proofModalTask?.subject || "");
          const token = localStorage.getItem("twinstudy_auth_token") || "";
          const email = localStorage.getItem("twinstudy_user_email") || state?.user?.email || "";
          const headers = {
            ...(token ? { "Authorization": `Bearer ${token}` } : {}),
            ...(email ? { "x-user-email": email } : {})
          };
          const res = await fetch("/api/tasks/generate-proof-quiz", {
            method: "POST",
            headers,
            body: form
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            showNotification(data.message || "TwinStudy could not generate a quiz from these notes. Try a clearer PDF, image, or text file.");
            return;
          }
          if (!Array.isArray(data.questions) || data.questions.length < 7 || data.questions.length > 10) {
            showNotification("The generated quiz did not contain 7–10 valid questions. Please try the upload again.");
            return;
          }
          setQuizQuestions(data.questions);
          setQuizAnswers({});
          setQuizSubmitted(false);
          setQuizFeedback(null);
          showNotification(`Generated ${data.questions.length} MCQs from your uploaded notes.`);

          showNotification("Could not connect to the quiz generator. Check the server and try again.");

      // PROOF SUBMISSION & VERIFICATION EVALUATION
      const handleSubmitProofAndQuiz = async () => {
        if (!proofFile) {
          showNotification("⚠️ Please upload your study notes, code file, or document first.");
          return;
        }

        if (!quizQuestions.length) {
          showNotification("Upload your notes and wait for the note-based quiz to generate before submitting.");
          return;
        }
        if (Object.keys(quizAnswers).length < quizQuestions.length) {
          showNotification(`Please answer all ${quizQuestions.length} MCQs before submitting.`);
          return;
        }

        // Score the validated questions generated from the uploaded notes
        let score = 0;
        quizQuestions.forEach((q, idx) => {
          if (quizAnswers[idx] === q.correct) score++;
        });

        const passMark = Math.max(5, Math.ceil(quizQuestions.length * 0.7)); // 70% pass threshold, rounded up (minimum 5 correct)
        const passed = score >= passMark;
        setQuizSubmitted(true);
        setQuizFeedback({
          score: score,
          total: quizQuestions.length,
          passed: passed
        });

        if (!passed) {
          showNotification(`Score: ${score}/${quizQuestions.length}. Review your uploaded material and answer at least ${passMark}/${quizQuestions.length} correctly to prove comprehension.`);
          return;

      // ---------------- SUBJECT & TIMETABLE ACTIONS ----------------

      const handleExtractAcademicDocuments = async () => {
        if (!academicTimetableFile && !academicCalendarFile) {
          showNotification("Choose a timetable or academic calendar file first.");

        setAcademicExtractionLoading(true);
        setAcademicExtractionError("");
        setAcademicExtraction(null);
        setAcademicExtractionImported(false);

        try {
          const form = new FormData();
          if (academicTimetableFile) form.append("timetable_file", academicTimetableFile);
          if (academicCalendarFile) form.append("calendar_file", academicCalendarFile);

          const token = localStorage.getItem("twinstudy_auth_token") || "";
          const res = await fetch("/api/academic/extract-documents", {
            method: "POST",
            headers: token ? { "Authorization": `Bearer ${token}` } : {},
            body: form
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.message || "Could not read the documents.");

          setAcademicExtraction(data.extraction || {});
          showNotification("Documents analyzed. Review the extracted details below.");
        } catch (error) {
          const message = error.message || "Document analysis failed. Please try again.";
          setAcademicExtractionError(message);
          showNotification(message);
        } finally {
          setAcademicExtractionLoading(false);
        }
      };

      const handleUseExtractedAcademicData = async () => {
        if (!academicExtraction || academicImportSaving) return;

        const extracted = academicExtraction;
        const studentEmail = String(state?.user?.email || localStorage.getItem("twinstudy_user_email") || "").trim().toLowerCase();
        const token = localStorage.getItem("twinstudy_auth_token") || "";
        if (!studentEmail || !token) {
          const message = "Please sign in again before saving imported academic records.";
          setAcademicExtractionError(message);
          showNotification(message);
          return;
        }

        let latestState;
        try {
          const latestResponse = await fetch(`/api/state?email=${encodeURIComponent(studentEmail)}`, {
            headers: { "Authorization": `Bearer ${token}`, "x-user-email": studentEmail }
          });
          latestState = await latestResponse.json();
          if (!latestResponse.ok || String(latestState?.user?.id || "") !== String(state?.user?.id || "")) {
            throw new Error(latestState?.message || "The signed-in student's academic state could not be loaded.");
          }
        } catch (error) {
          const message = error.message || "Could not reload current academic records. Please retry before importing.";
          setAcademicExtractionError(message);
          showNotification(message);
          return;
        }
        if (latestState.academic_revision !== state?.academic_revision || latestState.calendar_revision !== state?.calendar_revision) {
          await notifyStaleDraft("Imported academic data");
          return;
        }

        const extractedProfile = extracted.academic_profile || {};
        const profileKeys = ["student_name", "college", "course", "specialization", "semester", "academic_year"];
        const nextProfile = { ...(latestState.academic_profile || {}), ...academicProfile };
        profileKeys.forEach(key => {
          if (typeof extractedProfile[key] === "string" && extractedProfile[key].trim()) {
            nextProfile[key] = extractedProfile[key].trim();
          }
        });

        const importedSubjects = (Array.isArray(extracted.subjects) ? extracted.subjects : [])
          .filter(item => item && typeof item.name === "string" && item.name.trim())
          .map((item, index) => ({ ...item, id: item.id || `import_sub_${Date.now()}_${index}`, name: item.name.trim() }));
        const nextSubjects = [...(Array.isArray(latestState.subjects) ? latestState.subjects : [])];
        const mergeSubject = item => {
          const key = String(item?.name || "").trim().toLowerCase();
          if (!key) return;
          const idIndex = item.id ? nextSubjects.findIndex(existing => existing.id === item.id) : -1;
          if (idIndex >= 0) {
            nextSubjects[idIndex] = { ...nextSubjects[idIndex], ...item };
            return;
          }
          const subjectNames = new Set(nextSubjects.map(existing => String(existing.name || "").trim().toLowerCase()));
          if (!subjectNames.has(key)) {
            nextSubjects.push({ ...item, color: item.color || "#00C4CC", type: item.type || "Lecture" });
          }
        };
        (Array.isArray(subjectsList) ? subjectsList : []).forEach(mergeSubject);
        importedSubjects.forEach(mergeSubject);
        const subjectByName = new Map(nextSubjects.map(item => [String(item.name || "").trim().toLowerCase(), item]));

        const weekdayNames = { mon: "Monday", tue: "Tuesday", wed: "Wednesday", thu: "Thursday", fri: "Friday", sat: "Saturday", sun: "Sunday" };
        const normalizeTime = value => {
          const match = String(value || "").trim().toUpperCase().match(/^(\d{1,2})(?::([0-5]\d))?\s*(AM|PM)?$/);
          if (!match) return "";
          let hour = Number(match[1]);
          const minute = Number(match[2] || "0");
          if (match[3]) {
            if (hour < 1 || hour > 12) return "";
            hour = (hour % 12) + (match[3] === "PM" ? 12 : 0);
          } else if (hour > 23) return "";
          return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
        };
        const validDays = new Set(Object.values(weekdayNames));
        const sourceClasses = Array.isArray(extracted.classes) ? extracted.classes : [];
        const importedClasses = sourceClasses.flatMap((item, index) => {
          if (!item || typeof item.subject !== "string" || !item.subject.trim()) return [];
          const rawDay = String(item.day || "").trim().toLowerCase().replace(/\.$/, "");
          const day = weekdayNames[rawDay.slice(0, 3)] || Object.values(weekdayNames).find(name => name.toLowerCase() === rawDay);
          if (!day || !validDays.has(day)) return [];
          const subjectName = item.subject.trim();
          const subjectRecord = subjectByName.get(subjectName.toLowerCase());
          const startTime = normalizeTime(item.start_time);
          const endTime = normalizeTime(item.end_time);
          return [{
            ...item,
            id: item.id || `import_class_${Date.now()}_${index}`,
            day,
            subject: subjectName,
            subject_id: item.subject_id || subjectRecord?.id || "",
            start_time: startTime,
            end_time: endTime,
            time: startTime && endTime ? `${startTime} - ${endTime}` : "Time needs review",
            color: item.color || subjectRecord?.color || "#00C4CC",
            type: item.type || subjectRecord?.type || "Lecture",
            week_type: item.week_type || "All"
          }];
        });
        const existingClasses = Array.isArray(latestState.classes) ? [...latestState.classes] : [];
        const classKey = item => `${String(item.day || "").toLowerCase()}|${String(item.subject || item.subject_name || "").trim().toLowerCase()}|${item.start_time || ""}|${item.end_time || ""}`;
        const nextClasses = [...existingClasses];
        const mergeClass = item => {
          const idIndex = item.id ? nextClasses.findIndex(existing => existing.id === item.id) : -1;
          if (idIndex >= 0) {
            nextClasses[idIndex] = { ...nextClasses[idIndex], ...item };
            return;
          }
          const classKeys = new Set(nextClasses.map(classKey));
          const key = classKey(item);
          if (!classKeys.has(key)) {
            nextClasses.push(item);
          }
        };
        (Array.isArray(classesList) ? classesList : []).forEach(mergeClass);
        importedClasses.forEach(mergeClass);

        const mergeCalendarRecords = (existing, incoming, kind) => {
          const result = [...(Array.isArray(existing) ? existing : [])];
          const keyFor = item => {
            const id = String(item?.id || "").trim();
            const title = String(item?.title || item?.subject_name || item?.subject || item?.name || "").trim().toLowerCase();
            const date = String(item?.event_date || item?.exam_date || item?.date || "").slice(0, 10);
            const category = String(item?.event_type || item?.type || "").trim().toLowerCase();
            return id ? `id:${id}` : `${kind}:${title}|${date}|${category}`;
          };
          const keys = new Set(result.map(keyFor));
          (Array.isArray(incoming) ? incoming : []).forEach(item => {
            if (!item || typeof item !== "object") return;
            const key = keyFor(item);
            if (!keys.has(key)) {
              result.push(item);
              keys.add(key);
            }
          });
          return result;
        };
        const importedEvents = (Array.isArray(extracted.calendar_events) ? extracted.calendar_events : [])
          .filter(item => item && typeof item === "object")
          .map(item => ({ ...item, event_date: item.event_date || item.date || "" }));
        const importedCalendarExams = (Array.isArray(extracted.exams) ? extracted.exams : [])
          .filter(item => item && typeof item === "object")
          .map(item => ({ ...item, exam_date: item.exam_date || item.date || "" }));
        const nextCalendarEvents = mergeCalendarRecords(
          mergeCalendarRecords(latestState.calendar_events, state?.calendar_events, "event"), importedEvents, "event"
        );
        const nextCalendarExams = mergeCalendarRecords(
          mergeCalendarRecords(latestState.calendar_exams, state?.calendar_exams, "exam"), importedCalendarExams, "exam"
        );

        // Keep the reviewed draft visible if persistence fails or the revision is stale.
        setAcademicProfile(nextProfile);
        setSubjectsList(nextSubjects);
        setClassesList(nextClasses);
        setExtractedExamsPending(importedCalendarExams);
        setExtractedCalendarEventsPending(importedEvents);
        setAcademicImportSaving(true);
        setAcademicExtractionError("");
        try {
          const response = await fetch("/api/academic/save", {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`,
              "x-user-email": studentEmail
            },
            body: JSON.stringify({
              email: studentEmail,
              academic_profile: nextProfile,
              academic_revision: state?.academic_revision,
              calendar_revision: state?.calendar_revision,
              subjects: nextSubjects,
              classes: nextClasses,
              exams: Array.isArray(extracted.exams) ? extracted.exams : [],
              calendar_events: nextCalendarEvents,
              calendar_exams: nextCalendarExams
            })
          });
          const result = await response.json();
          if (!response.ok || result.status !== "success") {
            if (response.status === 409 && result.code === "stale_revision") {
              await notifyStaleDraft("Imported academic data");
            } else {
              const message = result.message || "Import could not be saved. Your reviewed draft remains available; please retry.";
              setAcademicExtractionError(message);
              showNotification(message);
            }
            return;
          }

          const refreshed = await fetchState();
          if (!refreshed) {
            const message = "The import was saved, but the dashboard could not refresh. Reload the page to see the saved records.";
            setAcademicExtractionError(message);
            showNotification(message);
            return;
          }
          setExtractedExamsPending([]);
          setExtractedCalendarEventsPending([]);
          setAcademicExtractionImported(true);
          setShowSetupModal(false);
          const skippedClasses = sourceClasses.length - importedClasses.length;
          const timeReviewClasses = importedClasses.filter(item => !item.start_time || !item.end_time).length;
          showNotification(`Imported and saved ${importedSubjects.length} subjects, ${importedClasses.length} class sessions, ${importedCalendarExams.length} exams, and ${importedEvents.length} calendar events.${skippedClasses > 0 ? ` ${skippedClasses} row(s) need a clear weekday or subject and were left for manual entry.` : ""}${timeReviewClasses > 0 ? ` ${timeReviewClasses} class time(s) need manual review.` : ""}`);
        } catch (error) {
          const message = "Academic import failed to save. Your reviewed draft remains available; check the connection and retry.";
          setAcademicExtractionError(message);
          showNotification(message);
        } finally {
          setAcademicImportSaving(false);
        }
      };

      const handleSaveCompleteAcademicSetup = async () => {
        if (!academicProfile.college.trim()) {
          setSetupStep(1);
          showNotification("Please enter College/University name.");
          return;
        }
        if (!academicProfile.course.trim()) {
          setSetupStep(1);
          showNotification("Please enter Course/Degree name.");
          return;
        }
        if (subjectsList.length === 0) {
          setSetupStep(2);
          showNotification("Please add at least one subject.");
          return;
        }

        try {
          const token = localStorage.getItem("twinstudy_auth_token") || "";
          const userEmail = (state?.user?.email || localStorage.getItem("twinstudy_user_email") || "").trim().toLowerCase();
          if (!userEmail) {
            showNotification("Please sign in again before saving your academic setup.");
            return;
          }
          const res = await fetch("/api/academic/save", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...(token ? { "Authorization": `Bearer ${token}` } : {}),
              "x-user-email": userEmail
            },
            body: JSON.stringify({
              email: userEmail,
              academic_profile: academicProfile,
              academic_revision: state?.academic_revision,
              calendar_revision: state?.calendar_revision,
              subjects: subjectsList,
              classes: classesList,
              calendar_events: extractedCalendarEventsPending.length
                ? extractedCalendarEventsPending
                : (state?.calendar_events || []),
              calendar_exams: extractedExamsPending.length
                ? extractedExamsPending
                : (state?.calendar_exams || [])
            })
          });
          const data = await res.json();
          if (res.ok) {
            try {
              localStorage.removeItem(
                `twinstudy_academic_setup_draft_${String(userEmail).trim().toLowerCase()}`
              );
            } catch (error) {
              console.warn("Academic setup draft could not be cleared.");
            }
            showNotification("Academic Profile & Timetable successfully saved!");
            setShowSetupModal(false);
            await fetchState();
          } else {
            if (res.status === 409 && data.code === "stale_revision") {
              await notifyStaleDraft("Academic setup");
            } else {
              showNotification(data.message || "Failed to save profile.");
            }
          }
        } catch (e) {
          showNotification("Error connecting to server.");
        }
      };

      // Format seconds into MM:SS for focus timer
      const formatTimer = (totalSeconds) => {
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const getGreeting = () => {
        const hour = new Date().getHours();
        if (hour < 12) return "Good morning";
        if (hour < 17) return "Good afternoon";
        return "Good evening";
      };

      const filteredClasses = classesList.filter(c => {
        if (scheduleFilterDay === "All") return true;
        if (scheduleFilterDay === "Today") {
          const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
          const currentDay = days[new Date().getDay()];
          return c.day === currentDay;
        }
        return c.day === scheduleFilterDay;
      });

      const calendarWeekEvents = (() => {
        const today = new Date();
        const weekStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7)); // Monday
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekEnd.getDate() + 7); // exclusive Sunday+1 boundary

        const normalizeDate = (value) => {
          if (!value) return null;
          const raw = String(value).trim();
          const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
          let parsed;
          if (iso) parsed = new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
          else parsed = new Date(raw);
          if (Number.isNaN(parsed.getTime())) return null;
          return new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
        };

        const sourceEvents = [
          ...(Array.isArray(state?.calendar_events) ? state.calendar_events.map(item => ({ ...item, __kind: "event" })) : []),
          ...(Array.isArray(state?.calendar_exams) ? state.calendar_exams.map(item => ({ ...item, __kind: "exam" })) : []),
          ...(Array.isArray(state?.exams) ? state.exams.map(item => ({ ...item, __kind: "exam" })) : [])
        ];
        const seen = new Set();
        return sourceEvents.map((item) => {
          const dateValue = item.event_date || item.exam_date || item.date || item.due_date || item.start_date || "";
          const date = normalizeDate(dateValue);
          const title = item.title || item.subject_name || item.subject || item.name || "Academic event";
          const kind = item.__kind === "exam" ? "Exam" : (item.event_type || item.type || "Event");
          return { ...item, __date: date, __dateValue: dateValue, __title: title, __kindLabel: kind };
        }).filter(item => {
          if (!item.__date || item.__date < weekStart || item.__date >= weekEnd) return false;
          const key = `${item.__date.getFullYear()}-${item.__date.getMonth()+1}-${item.__date.getDate()}|${String(item.__title).toLowerCase()}|${String(item.__kindLabel).toLowerCase()}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        }).sort((a, b) => a.__date - b.__date || String(a.__title).localeCompare(String(b.__title)));
      })();

      const isMinorStudent = state?.user?.is_minor || (state?.user?.age && state.user.age < 18);

      return (
        <div className="min-h-screen flex flex-col w-full text-navySlate text-sm antialiased font-sans">
          
          {/* ========================================================================= */}
          {/* VIEW 1: SAAS LANDING PAGE (CLEAN LOGO WITHOUT UP 'HUMAN TWIN' BADGE)      */}
          {/* ========================================================================= */}
          {view === "landing" && (
            <div className="flex flex-col min-h-screen justify-between">
              
              {/* Sticky Top Header Navigation */}
              <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-white py-4 px-6">
                <div className="max-w-7xl mx-auto flex items-center justify-between">

                  </div>

                  <div>
                    <label className="block font-bold text-navySlate mb-1">What should your Digital Twin learn for next time?</label>
                    <input
                      type="text"
                      value={feedbackNotes}
                      onChange={(e) => setFeedbackNotes(e.target.value)}
                      placeholder="Enter your full name"
                      className="w-full px-3 py-2 rounded-xl border border-navySlate/20 text-xs focus:outline-none focus:border-cyanAccent"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 text-xs font-bold">
                  <button
                    onClick={() => setShowFeedbackModal(false)}
                    className="px-4 py-2 rounded-xl text-navySlate/70 hover:bg-white"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleSubmitRealityFeedback}
                    className="px-4 py-2 rounded-xl btn-cyan font-black shadow-md"
                  >
                    Save Reality Feedback ➔
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3: RECORD NEW ACADEMIC GRADE */}
          {showRecordGradeModal && (
            <div className="fixed inset-0 bg-navySlate/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-panel p-6 sm:p-8 rounded-3xl max-w-md w-full space-y-4 border border-white shadow-2xl">
                <div className="flex justify-between items-center border-b border-navySlate/10 pb-3">
                  <h3 className="font-extrabold text-base text-navySlate">Record Assessment Result</h3>
                  <button onClick={() => setShowRecordGradeModal(false)} className="text-navySlate/60 hover:text-navySlate font-bold">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-navySlate mb-1">Enrolled Subject *</label>
                    <select
                      value={gradeSubjectId}
                      onChange={(e) => setGradeSubjectId(e.target.value)}
                      className="w-full p-2.5 rounded-xl border border-navySlate/20 text-xs bg-white focus:outline-none"
                    >
                      <option value="">Select Enrolled Subject</option>
                      {(state?.subjects || []).map((s) => (
                        <option key={s.id || s.name} value={s.id || s.name}>
                          {s.name} ({s.code || s.credits + " cr"})
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block font-bold text-navySlate mb-1">Assessment Name *</label>
                    <input
                      type="text"
                      value={gradeAssessmentName}
                      onChange={(e) => setGradeAssessmentName(e.target.value)}
                      placeholder="Enter your full name"
                      className="w-full px-3 py-2 rounded-xl border border-navySlate/20 text-xs focus:outline-none focus:border-cyanAccent"
                    />
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="block font-bold text-navySlate mb-1">Score *</label>
                      <input
                        type="number"
                        value={gradeScore}
                        onChange={(e) => setGradeScore(e.target.value)}
                        placeholder="45"
                        className="w-full px-3 py-2 rounded-xl border border-navySlate/20 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-navySlate mb-1">Max Score *</label>
                      <input
                        type="number"
                        value={gradeMaxScore}
                        onChange={(e) => setGradeMaxScore(e.target.value)}
                        placeholder="50"
                        className="w-full px-3 py-2 rounded-xl border border-navySlate/20 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-navySlate mb-1">Weight (%)</label>
                      <input
                        type="number"
                        value={gradeWeight}
                        onChange={(e) => setGradeWeight(e.target.value)}
                        placeholder="25"
                        className="w-full px-3 py-2 rounded-xl border border-navySlate/20 text-xs"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-navySlate mb-1">Teacher / Instructor Notes</label>
                    <input
                      type="text"
                      value={gradeNotes}
                      onChange={(e) => setGradeNotes(e.target.value)}
                      placeholder="Enter your full name"
                      className="w-full px-3 py-2 rounded-xl border border-navySlate/20 text-xs"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 text-xs font-bold">
                  <button
                    onClick={() => setShowRecordGradeModal(false)}
                    className="px-4 py-2 rounded-xl text-navySlate/70 hover:bg-white"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleRecordNewGrade}
                    className="px-4 py-2 rounded-xl btn-cyan font-black shadow-md"
                  >
                    Save Grade ➔
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
